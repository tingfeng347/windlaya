[project]
name = "windlaya"
version = "0.1.0"
description = "Local multilingual Laya System-1 Decision API"
readme = "README.md"
authors = [
    { name = "tingfeng347", email = "3152912378@qq.com" }
]
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "fastapi>=0.115,<1",
    "filelock>=3.20",
    "laya>=0.3.4,<0.4",
    "modelscope-hub>=0.4.2,<0.5",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
windlaya = "app.cli:main"
windlaya-models = "app.model_cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13,<3",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]
playground = [
    "httpx>=0.28,<1",
    "streamlit>=1.54,<2",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
markers = [
    "integration: tests that download and run real Laya checkpoints",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
